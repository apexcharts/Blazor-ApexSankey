name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch tags for version info

      - name: get latest version
        id: version
        run: |
          # get latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # remove 'v' prefix for dotnet version
          VERSION=${LATEST_TAG#v}
          # ensure version is valid (handle edge cases)
          if [ -z "$VERSION" ] || [ "$VERSION" = "v0.0.0" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Deploying version: $LATEST_TAG (dotnet version: $VERSION)"

      - name: setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: publish blazor app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Publishing with version: $VERSION"
          dotnet publish src/Blazor-ApexSankey.Demo/Blazor-ApexSankey.Demo.csproj \
            -c Release \
            -o publish \
            /p:Version="$VERSION"

      - name: Change base href for GitHub Pages (index.html + 404.html)
        run: |
          # The site is served from /Blazor-ApexSankey/, so the base href must
          # point there or every asset resolves against the origin root.
          sed -i 's/<base href="\/" \/>/<base href="\/Blazor-ApexSankey\/" \/>/g' publish/wwwroot/index.html
          # 404.html is served for any deep link (e.g. /Blazor-ApexSankey/chord).
          # Make it a copy of the rewritten index so the SPA boots with the correct
          # base href and the Blazor router resolves the route client-side. Without
          # this, deep links load 404.html with base "/" and every asset 404s
          # (the page hangs on "Loading...").
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Guard: fail the deploy if either file still carries the unrewritten base
          # href, or if 404.html did not get the rewritten one.
          if grep -q '<base href="/" />' publish/wwwroot/index.html publish/wwwroot/404.html; then
            echo "::error::base href was not rewritten for GitHub Pages"; exit 1
          fi
          if ! grep -q '<base href="/Blazor-ApexSankey/" />' publish/wwwroot/404.html; then
            echo "::error::404.html is missing the rewritten base href"; exit 1
          fi

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "publish/wwwroot"

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
